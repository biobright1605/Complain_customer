# =============================================================
#  docker-compose.yml — ติดตั้งบน server ภายในบริษัท (แอป + MariaDB)
#  ใช้งาน:  cp .env.example .env  (แก้รหัสผ่าน)  แล้ว  docker compose up -d --build
# =============================================================
services:
  # ---------- ฐานข้อมูล ----------
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sugar_complaint}
      MARIADB_USER: ${DB_USER:-sugar_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?กรุณาตั้ง DB_PASSWORD ใน .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?กรุณาตั้ง DB_ROOT_PASSWORD ใน .env}
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ไม่เปิด port ออกนอกเครื่อง (แอปเชื่อมผ่าน network ภายใน docker)

  # ---------- แอป ----------
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:   # ข้อมูลฐานข้อมูล
  uploads:   # ไฟล์แนบ
